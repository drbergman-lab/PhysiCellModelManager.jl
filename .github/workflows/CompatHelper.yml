name: CompatHelper
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - name: Check if Julia is already available in the PATH
        id: julia_in_path
        run: which julia
        continue-on-error: true
      - name: Install Julia, but only if it is not already available in the PATH
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'
          arch: ${{ runner.arch }}
        if: steps.julia_in_path.outcome != 'success'
      - name: "Add the General registry via Git"
        run: |
          import Pkg
          ENV["JULIA_PKG_SERVER"] = ""
          Pkg.Registry.add("General")
        shell: julia --color=yes {0}
      - name: "Install CompatHelper"
        run: |
          import Pkg
          name = "CompatHelper"
          uuid = "aa819f21-2bde-4658-8897-bab36330d9b7"
          version = "3"
          Pkg.add(; name, uuid, version)
        shell: julia --color=yes {0}
      - name: "Run CompatHelper"
        run: |
          import CompatHelper, Pkg
          # Check against BergmanLabRegistry as well as General so that compat
          # bumps are also proposed for dependencies registered in our registry.
          registries = [
              Pkg.RegistrySpec(
                  name = "General",
                  uuid = "23338594-aafe-5451-b93e-139f81909106",
                  url = "https://github.com/JuliaRegistries/General.git",
              ),
              Pkg.RegistrySpec(
                  name = "BergmanLabRegistry",
                  uuid = "ac5acf56-370c-4ac8-b895-7453b15dc18b",
                  url = "https://github.com/drbergman-lab/BergmanLabRegistry.git",
              ),
          ]
          CompatHelper.main(; registries)
        shell: julia --color=yes {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # An SSH deploy key lets the PRs that CompatHelper opens trigger CI
          # (PRs pushed with GITHUB_TOKEN do not). We reuse the Documenter key.
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
